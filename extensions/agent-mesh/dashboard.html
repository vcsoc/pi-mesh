<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f5f6f4">
  <title>Pi Agent Mesh</title>
  <link rel="stylesheet" href="/dashboard.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><i>M</i><span><b>Agent Mesh</b><small>Local coordination</small></span></div>
    <div class="thread-name"><span>Thread</span><b id="top-thread">All coordination</b><span id="top-message-count">· 0 messages</span></div>
    <div class="top-actions">
      <span id="connection" class="connection offline">Connecting</span>
      <label class="auto-control"><span>Auto-scroll latest</span><span class="switch"><input id="auto-scroll" type="checkbox" checked><span class="slider"></span></span></label>
      <div class="font-scale" aria-label="Message text size"><span>Message text</span><button id="font-down" type="button" aria-label="Decrease message text size">−</button><output id="font-level">100%</output><button id="font-up" type="button" aria-label="Increase message text size">+</button></div>
      <button id="jump-latest" type="button">Jump to latest</button>
      <button id="theme-toggle" type="button">Dark</button>
      <a href="/help">Help</a>
      <a href="/api/export">Export</a>
    </div>
  </header>

  <div class="workspace">
    <aside class="context">
      <div class="section-title first"><span>Related threads</span><span id="thread-count">0</span></div>
      <div id="threads" class="threads"></div>
      <button id="load-older" class="load-older" type="button" hidden>Load older messages</button>

      <div class="section-title participant-heading"><span>Participants</span><span id="agent-count" class="participant-count">0</span><div class="participant-filters" aria-label="Filter participants by status"><button class="participant-filter active" type="button" data-participant-filter="all" aria-label="Show all participants" title="All" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"></circle><circle cx="17" cy="9" r="2.5"></circle><path d="M3 19c.5-3 2.2-5 5-5s4.5 2 5 5M14 15c2.8-.5 5 1 6 4"></path></svg></button><button class="participant-filter" type="button" data-participant-filter="working" aria-label="Show working participants" title="Working" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 10 7-10 7z"></path></svg></button><button class="participant-filter" type="button" data-participant-filter="idle" aria-label="Show idle participants" title="Idle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9 9v6M15 9v6"></path></svg></button><button class="participant-filter" type="button" data-participant-filter="offline" aria-label="Show offline participants" title="Offline" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m6 6 12 12"></path></svg></button></div></div>
      <div id="agents" class="people" aria-live="polite"></div>
    </aside>

    <main id="timeline-main" class="timeline-main">
      <section id="messages" class="messages" aria-live="polite"></section>
      <div class="latest"><span id="latest-label">No messages yet</span></div>
    </main>

    <aside class="intervention">
      <form id="composer" class="compose">
        <div class="compose-head"><b>Intervene</b><span>direct user steering</span></div>
        <div class="fields"><label>To<select id="to" required><option value="*">All agents</option></select></label><label>Intent<select id="kind"><option value="steer">Steer</option><option value="task">Task</option><option value="question">Question</option><option value="decision">Decision</option><option value="plan">Plan</option><option value="message">Message</option></select></label></div>
        <label>Thread ID <small>optional</small><input id="thread" maxlength="100" placeholder="e.g. telemetry-contract"></label>
        <label>Message<textarea id="content" maxlength="20000" rows="8" required placeholder="Add direction without losing context…"></textarea></label>
        <p class="key-hint"><kbd>Enter</kbd> sends · <kbd>Shift</kbd>+<kbd>Enter</kbd> or <kbd>Ctrl</kbd>+<kbd>Enter</kbd> adds a new line</p>
        <button class="send" type="submit">Send intervention</button><output id="composer-status" role="status"></output>
      </form>
    </aside>
  </div>
  <script src="/dashboard.js" defer></script>
</body>
</html>
